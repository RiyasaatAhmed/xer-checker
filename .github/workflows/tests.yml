# Runs every test on each push and pull request: the backend with pytest, the frontend with lint, tests and a build.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # the jobs only read the code

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend # checker.py and the tests find data/ from here
    env:
      GEMINI_API_KEY: "" # the tests never call Gemini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # the version in backend/Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0" # the version in frontend/Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
