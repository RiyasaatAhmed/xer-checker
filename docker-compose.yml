# Runs the backend, frontend and database on your machine:
#   docker compose up --build
# Settings come from .env (copy .env.example). Everything runs without it.

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false  # without it, the AI is off and code writes the summaries
    environment:
      # The same name, user and password as the database service below
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-xer_checker}:${POSTGRES_PASSWORD:-local-only}@database:5432/${POSTGRES_DB:-xer_checker}
    depends_on:
      database:
        condition: service_healthy  # the API creates its tables at start, so the database must be ready
    ports:
      - "8000:8000"  # the API; open http://localhost:8000/docs
    healthcheck:  # ready once the API answers
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "3000:80"  # the app; open http://localhost:3000
    depends_on:
      - backend  # nginx passes /api to it

  database:
    build: ./database
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xer_checker}
      POSTGRES_USER: ${POSTGRES_USER:-xer_checker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only}  # local default; set a strong one in .env on a server
    ports:
      - "5432:5432"
    volumes:
      - database-data:/var/lib/postgresql/data  # keeps the data when the container stops
    healthcheck:  # ready once it accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  database-data:
