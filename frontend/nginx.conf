# Serves the React app, and passes /api to the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The API: same site for the browser, so the API needs no CORS
    location /api/ {
        proxy_pass http://backend:8000;
        client_max_body_size 50m;  # the backend's own upload limit
        proxy_read_timeout 120s;   # a check with the AI summary can take a while
    }

    # Any other path loads the app
    location / {
        try_files $uri /index.html;
    }
}
