# Serves the React app, and passes /api to the backend container.
server {
    listen 80;
    root /usr/share/nginx/html;

    # The API: same site for the browser, so the API needs no CORS
    location /api/ {
        proxy_pass http://backend:8000;
        client_max_body_size 501m;  # the backend's 500 MB limit, plus room for the form around the file
        proxy_read_timeout 900s;    # a file near 500 MB takes minutes to check and save, and the AI summary adds more
    }

    # Any other path loads the app
    location / {
        try_files $uri /index.html;
    }
}
